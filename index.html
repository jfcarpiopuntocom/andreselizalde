<style>
:root{color-scheme:dark;--ink:#070713;--light:#fff9f1;--cyan:#62f6fb;--pink:#ff54cd;--gold:#ffad71}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--light);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:radial-gradient(ellipse at 65% 80%,#321052 0%,transparent 52%),linear-gradient(180deg,#060719,#100920)}
a,button{font:inherit;-webkit-tap-highlight-color:transparent}a{color:inherit}button{color:inherit}
.portal{container-type:inline-size;position:relative;width:100vw;height:100dvh;margin:auto;overflow:hidden;display:flex;flex-direction:column;isolation:isolate;box-shadow:0 0 100px #000}
.portal:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,transparent 97%,#a034bb30 98%),linear-gradient(0deg,transparent 97%,#553cbb25 98%),radial-gradient(ellipse at 50% 90%,#3f177e,#05081b 67%);background-size:43px 43px,43px 43px,100% 100%;transform:perspective(250px) rotateX(3deg) scale(1.03)}
.spark{position:absolute;width:3px;height:3px;pointer-events:none;border-radius:50%;background:#e5feff;box-shadow:0 0 14px #8af3ff;animation:shimmer 4s ease-in-out infinite;z-index:0}
.spark.a{left:4%;top:32%}.spark.b{left:34%;top:3%;animation-delay:-1s}.spark.c{left:82%;top:19%;animation-delay:-2s}.spark.d{left:52%;top:91%;animation-delay:-3s}
@keyframes shimmer{50%{opacity:.22;transform:scale(.5)}}
.hero{position:relative;z-index:2;height:24%;flex:none;padding:1.65% 2.5% 0 9.2%;display:flex;align-items:flex-start;justify-content:space-between;gap:2%}
.brand{min-width:0;width:74%;align-self:flex-start}.brand h1{font-family:Georgia,"Times New Roman",serif;font-weight:800;margin:0;line-height:.86;letter-spacing:-.05em;text-shadow:0 4px 15px #0c061c;font-size:clamp(27px,5.8cqw,100px)}
.brand .first{display:block;font-size:.65em;color:#fff4ed;letter-spacing:-.045em;margin:0 0 .7%}
.brand .second{display:block;white-space:nowrap;background:linear-gradient(95deg,#ffb17a 0%,#ff63c9 30%,#ec84ff 60%,#6affff 96%);color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 9px #cb54f366)}
.tagline{font-size:clamp(9px,1.12cqw,19px);font-weight:850;letter-spacing:.25em;margin:1.5% 0 0 1.2%;text-transform:uppercase;white-space:nowrap;color:#fff9fb;text-shadow:0 2px 6px black}
.host{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:3%;width:28%;height:95%;margin-right:0;z-index:3}
.avatar{position:relative;width:38%;height:100%;border-radius:12px;border:2px solid #8cfbff;background:#100d28;box-shadow:0 0 13px #ff31c6,0 0 22px #2beaff;flex:none;overflow:hidden;padding:0;cursor:pointer}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.avatar:focus-visible,.tile:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.pupil{position:absolute;width:6%;height:5%;background:#ccfaff;box-shadow:0 0 4px #fff;border-radius:50%;pointer-events:none;top:52%;transition:transform 110ms ease}.pupil.left{left:45%}.pupil.right{left:59%}
.bubble{width:55%;max-height:95%;display:grid;place-items:center;border:2px solid #ae80ff;border-radius:16px;padding:5%;font:900 clamp(11px,1.53cqw,27px)/1.08 ui-monospace,Consolas,monospace;text-transform:uppercase;text-align:center;color:#fff;background:#070d27;box-shadow:0 0 18px #9256f8,0 0 11px #02f1e577;letter-spacing:-.04em}
.content{height:71%;display:grid;grid-template-columns:30% 39% 30%;justify-content:space-between;gap:.5%;padding:0 2%;z-index:1}
.stack{display:grid;grid-template-rows:1fr 1fr;gap:3.5%;min-height:0}
.tile{display:flex;flex-direction:column;overflow:hidden;min-height:0;border:2px solid var(--accent);border-radius:clamp(8px,1.5cqw,22px);background:#060917;text-align:left;text-decoration:none;box-shadow:0 0 15px color-mix(in srgb,var(--accent) 58%,transparent),inset 0 0 13px #000;cursor:pointer;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 0 27px var(--accent)}
.tile .scene{display:block;width:100%;flex:1;min-height:0;object-fit:cover;object-position:center 25%}
.tile .label{position:relative;display:flex;align-items:center;justify-content:space-between;gap:5px;background:#040612;padding:2.5% 4%;min-height:39%;flex:none;border-top:1px solid #ffffff19}
.tile strong{display:block;font:900 clamp(16px,2.05cqw,36px)/1.03 Georgia,"Times New Roman",serif;text-transform:uppercase;color:#fff;letter-spacing:-.027em;text-shadow:0 2px 4px black;max-width:100%}
.tile .desc{display:block;font-size:clamp(8px,.85cqw,14px);font-weight:800;letter-spacing:.055em;text-transform:uppercase;color:#deeaff;margin-top:4px;line-height:1.1}
.tile .arrow{flex:none;display:grid;place-items:center;width:clamp(22px,3.2cqw,50px);height:clamp(22px,3.2cqw,50px);border:2px solid #fff;border-radius:50%;font-size:clamp(16px,2.2cqw,36px);line-height:1;color:#fff}
.tile.cultura{--accent:#d84cff}.tile.iq{--accent:#4de8ff}.tile.puzzles{--accent:#ff9a51}.tile.librojuegos{--accent:#ed5ce9}
.center{position:relative;overflow:hidden;border-radius:35% 35% 8px 8px;background:radial-gradient(circle at 50% 30%,#ffbd9f,#682371 59%,#211339);border:1px solid #b55bd066}
.center img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;filter:saturate(1.14)}
.center:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 67%,#220d33a8 100%)}
.center .status{position:absolute;bottom:3%;left:5%;right:5%;z-index:2;text-align:center;font-weight:850;font-size:clamp(10px,1.1cqw,18px);letter-spacing:.1em;text-shadow:0 1px 6px black;color:#f9e0ff}
.footer{height:5%;display:flex;align-items:center;justify-content:center;font:800 clamp(10px,1.05cqw,17px) Georgia,serif;letter-spacing:.24em;white-space:nowrap;text-shadow:0 0 9px #b368ff}
.gate{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:24px;text-align:center;background:radial-gradient(circle at center,#442069,#080719 73%)}.gate svg{width:90px;height:90px;color:#83faff}.gate h2{font:800 clamp(30px,9vw,46px)/1.04 Georgia,serif;max-width:340px;margin:0}.gate p{font-size:18px;max-width:315px;color:#d8c8f9;line-height:1.4;margin:0}
.toast{position:fixed;z-index:20;left:50%;bottom:5%;transform:translateX(-50%);padding:12px 18px;border:2px solid #8cfbff;background:#090d25;color:white;border-radius:12px;font:800 15px/1.2 system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 0 22px #8ceaffaa}.toast.visible{opacity:1}
@media(orientation:portrait) and (pointer:coarse){.portal{display:none}.gate{display:flex}}
@media(orientation:landscape) and (max-height:560px){.hero{height:23%}.content{height:73%}.footer{height:4%}.brand h1{font-size:clamp(28px,5.2cqw,74px)}.tile .label{min-height:40%;padding:1.8% 3%}.tile strong{font-size:clamp(15px,1.95cqw,28px)}.tile .desc{font-size:clamp(8px,.81cqw,13px)}.bubble{font-size:clamp(11px,1.35cqw,23px)}}
@media(prefers-reduced-motion:reduce){*,*:after,*:before{animation:none!important;transition:none!important}}
</style></head>

(()=>{let timer;const toast=document.getElementById('toast');function flash(t){toast.textContent=t;toast.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('visible'),2200)}document.querySelectorAll('[data-soon]').forEach(b=>b.addEventListener('click',()=>flash('Andrés, los desafíos de '+b.dataset.soon+' están en construcción.')));document.getElementById('avatar').addEventListener('click',()=>flash('Mi tanque se llena con 80. ¡Y eso es apenas el comienzo!'));const av=document.getElementById('avatar'),l=document.getElementById('leftPupil'),r=document.getElementById('rightPupil');function eyes(x,y){const a=av.getBoundingClientRect();const dx=Math.max(-3,Math.min(3,(x-a.left-a.width/2)/12)),dy=Math.max(-2,Math.min(2,(y-a.top-a.height/2)/12));l.style.transform=r.style.transform=`translate(${dx}px,${dy}px)`}document.addEventListener('pointermove',e=>eyes(e.clientX,e.clientY),{passive:true});document.addEventListener('pointerdown',e=>eyes(e.clientX,e.clientY),{passive:true});})();
